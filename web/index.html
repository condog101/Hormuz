<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Straight Outta Hormuz</title>
    <meta name="description" content="Straight Outta Hormuz: a 90s-rap-album arcade destroyer run through the Strait of Hormuz, featuring Big Don." />
    <link rel="icon" href="assets/sprites/advisory.png" />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        overflow: hidden;
        font-family: 'Press Start 2P', monospace;
      }
      #game { width: 100vw; height: 100vh; }
      #game { height: 100dvh; }
      canvas { image-rendering: pixelated; }
      html, body, #game, canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000000;
        color: #ffd84a;
        font-size: 14px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
      }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 700px) {
        #rotate { display: flex; }
      }
      #login {
        position: fixed;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: min(420px, 86vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
        color: #f3ead7;
        font-size: 12px;
      }
      #login[hidden] { display: none; }
      #login label { display: flex; flex-direction: column; gap: 8px; }
      #login input {
        font: inherit;
        font-size: 16px;
        padding: 10px;
        background: #000000;
        color: #ffd84a;
        border: 2px solid #8c8577;
        outline: none;
      }
      #login input:focus { border-color: #ffd84a; }
      #login .row { display: flex; gap: 10px; }
      #login button {
        flex: 1;
        font: inherit;
        font-size: 11px;
        padding: 10px 6px;
        background: #141210;
        color: #f3ead7;
        border: 2px solid #8c8577;
        cursor: pointer;
      }
      #login button:hover, #login button:focus { border-color: #ffd84a; color: #ffd84a; }
      #login .msg { font-size: 9px; line-height: 1.6; color: #8c8577; min-height: 3em; }
      #login .msg.error { color: #ff4a4a; }
      @media (pointer: coarse) {
        /* keep the inputs above the soft keyboard in landscape */
        #login { top: 8px; transform: translateX(-50%); gap: 8px; }
        #login label { gap: 4px; }
        #login input, #login button { padding: 6px; }
        #login .msg { min-height: 0; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div>ROTATE YOUR PHONE<br /><span style="color:#8c8577;font-size:10px">STRAIGHT OUTTA HORMUZ PLAYS SIDEWAYS</span></div></div>
    <form id="login" hidden autocomplete="off">
      <label>MC NAME
        <input name="callsign" maxlength="16" minlength="3" pattern="[A-Za-z0-9_ ]{3,16}" required spellcheck="false" />
      </label>
      <label>4-DIGIT PIN
        <input name="pin" type="password" inputmode="numeric" maxlength="4" minlength="4" pattern="[0-9]{4}" required />
      </label>
      <div class="row">
        <button type="submit" data-action="login">SIGN IN</button>
        <button type="submit" data-action="register">REGISTER</button>
      </div>
      <div class="row"><button type="button" data-action="cancel">CANCEL</button></div>
      <div class="msg"></div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
