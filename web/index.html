<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hormuz Run</title>
    <meta name="description" content="Arcade destroyer run through the Strait of Hormuz." />
    <link rel="icon" href="assets/sprites/hud_icons.png" />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        font-family: 'Press Start 2P', monospace;
      }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; }
      #login {
        position: fixed;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: min(420px, 86vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
        color: #e8f1ff;
        font-size: 12px;
      }
      #login[hidden] { display: none; }
      #login label { display: flex; flex-direction: column; gap: 8px; }
      #login input {
        font: inherit;
        font-size: 16px;
        padding: 10px;
        background: #05070d;
        color: #ffd84a;
        border: 2px solid #5a6d8c;
        outline: none;
      }
      #login input:focus { border-color: #ffd84a; }
      #login .row { display: flex; gap: 10px; }
      #login button {
        flex: 1;
        font: inherit;
        font-size: 11px;
        padding: 10px 6px;
        background: #1d2b46;
        color: #e8f1ff;
        border: 2px solid #5a6d8c;
        cursor: pointer;
      }
      #login button:hover, #login button:focus { border-color: #ffd84a; color: #ffd84a; }
      #login .msg { font-size: 9px; line-height: 1.6; color: #7f93b0; min-height: 3em; }
      #login .msg.error { color: #ff4a4a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <form id="login" hidden autocomplete="off">
      <label>CALLSIGN
        <input name="callsign" maxlength="16" minlength="3" pattern="[A-Za-z0-9_ ]{3,16}" required spellcheck="false" />
      </label>
      <label>4-DIGIT PIN
        <input name="pin" type="password" inputmode="numeric" maxlength="4" minlength="4" pattern="[0-9]{4}" required />
      </label>
      <div class="row">
        <button type="submit" data-action="login">SIGN IN</button>
        <button type="submit" data-action="register">REGISTER</button>
      </div>
      <div class="row"><button type="button" data-action="cancel">CANCEL</button></div>
      <div class="msg"></div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
