name = "hormuz-run"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hormuz-db"
database_id = "LOCAL-PLACEHOLDER" # replaced with the real id at deploy (wrangler d1 create hormuz-db)
migrations_dir = "worker/migrations"

[vars]
# Extra origin allowed to call /api cross-origin (e.g. a custom domain). Empty = same-origin only.
# http://localhost:5173 and http://127.0.0.1:5173 (Vite dev) are always allowed.
ALLOWED_ORIGIN = ""
